name: Daily Solver Tests

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/leetcode-daily.yml"
      - ".github/workflows/daily-solver-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/leetcode-daily.yml"
      - ".github/workflows/daily-solver-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Python unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"
