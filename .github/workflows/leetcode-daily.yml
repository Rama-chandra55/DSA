name: LeetCode Daily Solution

on:
  push:
    branches:
      - main
    paths:
      - "daily-solver-trigger.txt"
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-daily-solver
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate and review today's solution
        id: solver
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/daily_solver.py

      - name: Commit and push the solution
        if: steps.solver.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: ${{ steps.solver.outputs.commit_message }}
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
