name: LeetCode Daily Solution

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-daily-solver
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Python unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Restore source cooldown state
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/leetcode-source-cooldowns.json
          key: leetcode-source-cooldowns-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            leetcode-source-cooldowns-

      - name: Initialize source cooldown state
        env:
          SOURCE_COOLDOWN_FILE: ${{ runner.temp }}/leetcode-source-cooldowns.json
        run: |
          mkdir -p "$(dirname "$SOURCE_COOLDOWN_FILE")"
          if [ ! -f "$SOURCE_COOLDOWN_FILE" ]; then
            echo '{}' > "$SOURCE_COOLDOWN_FILE"
          fi

      - name: Generate and review today's solution
        id: solver
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-3.7-flash
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_COOLDOWN_FILE: ${{ runner.temp }}/leetcode-source-cooldowns.json
        run: python scripts/daily_solver.py

      - name: Commit and push the solution
        if: steps.solver.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: ${{ steps.solver.outputs.commit_message }}
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Save source cooldown state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/leetcode-source-cooldowns.json
          key: leetcode-source-cooldowns-${{ github.run_id }}-${{ github.run_attempt }}
